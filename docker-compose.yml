services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tomato_disease_api
    ports:
      - "8000:8000"
    environment:
      - CUDA_VISIBLE_DEVICES=-1
      - TF_ENABLE_ONEDNN_OPTS=0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  ui:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: tomato_disease_ui
    ports:
      - "8501:8501"
    environment:
      - CUDA_VISIBLE_DEVICES=-1
      - TF_ENABLE_ONEDNN_OPTS=0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

