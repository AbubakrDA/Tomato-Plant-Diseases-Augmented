name: CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx

      - name: Verify Model Assets Exist
        run: |
          python -c "import os; assert os.path.exists('tomato_cnn_outputs/tomato_disease_cnn_final.keras'), 'Model file missing!'"
          python -c "import os; assert os.path.exists('tomato_cnn_outputs/class_mapping.json'), 'Class mapping missing!'"

      - name: Run Test Suite
        env:
          CUDA_VISIBLE_DEVICES: "-1"
        run: |
          pytest tests/ -v

  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build FastAPI Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: tomato-disease-api:latest

      - name: Build Streamlit Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.streamlit
          push: false
          tags: tomato-disease-ui:latest
